<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="https://fonts.googleapis.com/css2?family=Quantico&display=swap" rel="stylesheet">
    <title>Battleship</title>
  </head>
  <body> 
    <div class="container">
      <div class="header">
        <h1 class="title">Battleship</h1>
        <p class="message" id="message">Message</p>
      </div>
      <div class="boards">
        <div class="board" id="playerboard"></div>
        <div class="board" id="computerboard"></div>
      </div>
      <div class="footer">
        <button class="btn randomize" id="randomize">Randomize fleet</button>
        <button class="btn newgame" id="newgame">New game</button>
      </div>
    </div>
  </body>
</html>
